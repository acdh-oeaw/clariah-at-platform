name: Feature request
description: Suggest an improvement or new feature for the website
assignees:
  - babslgam
  - stefanprobst
labels:
  - needs-review
  - enhancement
type: feature
body:
  - type: textarea
    attributes:
      label: Problem or motivation
      description: A clear and concise description of the problem this feature would solve, or why it would be useful.
    validations:
      required: true
  - type: textarea
    attributes:
      label: Proposed solution
      description: A clear and concise description of what you want to happen.
    validations:
      required: true
  - type: textarea
    attributes:
      label: Alternatives considered
      description: A clear and concise description of any alternative solutions or features you've considered.
    validations:
      required: false
  - type: textarea
    attributes:
      label: Additional context
      description: Add any other context or screenshots about the feature request here.
    validations:
      required: false
