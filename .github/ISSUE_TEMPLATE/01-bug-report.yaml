name: Bug report
description: Report a technical problem on the website
assignees:
  - babslgam
  - stefanprobst
labels:
  - needs-review
  - bug
type: bug
body:
  - type: input
    attributes:
      label: Page URL
      description: The address of the page where the problem occurs.
      placeholder: https://www.clariah.at/...
    validations:
      required: true
  - type: textarea
    attributes:
      label: Current behavior
      description: A concise description of the bug.
    validations:
      required: true
  - type: textarea
    attributes:
      label: Expected behavior
      description: A concise description of what you expected to happen.
    validations:
      required: true
  - type: textarea
    attributes:
      label: Steps to reproduce
      description: Steps to reproduce the behavior.
      placeholder: |
        1. Go to page '...'
        1. Click on '...'
        1. Scroll down to '...'
        1. See error
    validations:
      required: true
  - type: textarea
    attributes:
      label: Environment
      description: |
        Examples:
          - **Device**: Desktop
          - **Device resolution**: 1920x1080
          - **OS**: Ubuntu 24.04
          - **Browser**: Firefox
          - **Browser version**: 144
      value: |
        - Device:
        - Device resolution:
        - OS:
        - Browser:
        - Browser version:
    validations:
      required: false
  - type: textarea
    attributes:
      label: Additional context
      description: |
        Screenshots? Links? References? Anything that will give us more context about the issue you are encountering!

        Tip: You can attach images or files by clicking this area to highlight it and then dragging files in.
    validations:
      required: false
