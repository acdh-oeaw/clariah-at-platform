replicaCount: 1
image:
  repository: $repository
  tag: "$tag"
  pullPolicy: Always
  secrets: []
extraLabels:
  "ID": "$service_id"
gitlab:
  app: "$app_name"
  envURL: "$repo_url"
service:
  enabled: true
  name: "web"
  url: "$public_url"
  # So that `clariah.at` gets a route and a certificate. The app redirects it to `www.clariah.at`, see
  # `configs/redirects.config.ts`. The `from-to-www-redirect` annotation is not an option: traefik's ingress-nginx provider
  # skips the redirect when both hosts have a rule, and the chart adds a host to the rules and the certificate together.
  additionalHosts:
    - "clariah.at"
  type: ClusterIP
  externalPort: 3000
  internalPort: 3000
ingress:
  enabled: true
  path: "/"
  className: "traefik"
  annotations:
    cert-manager.io/cluster-issuer: letsencrypt-prod
    traefik.ingress.kubernetes.io/router.middlewares: kube-system-compress@kubernetescrd
livenessProbe:
  path: /health
  initialDelaySeconds: 15
  timeoutSeconds: 15
  periodSeconds: 30
  scheme: "HTTP"
  probeType: "httpGet"
readinessProbe:
  path: /health
  initialDelaySeconds: 5
  timeoutSeconds: 3
  scheme: "HTTP"
  probeType: "httpGet"
