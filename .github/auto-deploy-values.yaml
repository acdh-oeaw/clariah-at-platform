replicaCount: 1
image:
  repository: $repository
  tag: "$tag"
  pullPolicy: Always
  secrets: []
extraLabels:
  "ID": "$service_id"
gitlab:
  app: "$app_name"
  envURL: "$repo_url"
service:
  enabled: true
  name: "web"
  url: "$public_url"
  # Gets the apex domain onto the certificate and into the ingress rules, so it can be redirected to `www.` over https.
  additionalHosts:
    - "clariah.at"
  type: ClusterIP
  externalPort: 3000
  internalPort: 3000
ingress:
  enabled: true
  path: "/"
  className: "traefik"
  annotations:
    cert-manager.io/cluster-issuer: letsencrypt-prod
    # `redirect-to-www` adds `www.` to every host of this ingress, so it must only list the apex and `www.` hosts.
    traefik.ingress.kubernetes.io/router.middlewares: kube-system-redirect-to-www@kubernetescrd,kube-system-compress@kubernetescrd
livenessProbe:
  path: /health
  initialDelaySeconds: 15
  timeoutSeconds: 15
  periodSeconds: 30
  scheme: "HTTP"
  probeType: "httpGet"
readinessProbe:
  path: /health
  initialDelaySeconds: 5
  timeoutSeconds: 3
  scheme: "HTTP"
  probeType: "httpGet"
